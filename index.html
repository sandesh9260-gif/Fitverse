<style>

[data-theme=light]{--surface-0:#F4F7FB;--surface-1:#E9EEF5;--surface-2:#FFFFFF;--text-primary:#0F172A;--text-secondary:#506078;--border:rgba(15,23,42,.12);--border-strong:rgba(15,23,42,.3);--fill-success:#059669;--on-success:#FFFFFF;--bg-success:#D1FAE5;--text-success:#047857;--border-success:#059669;--fill-accent:#0284C7;--fill-pro:#7C3AED;--fill-warning:#D97706;--fill-danger:#DC2626;--text-danger:#B91C1C;--border-accent:#0284C7;--page:linear-gradient(160deg,#F4F7FB,#E6F4EF)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);background-attachment:fixed;color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:14px 12px 150px}
button{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{background:var(--surface-1)}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;padding:8px;min-height:38px}
input:not([type=checkbox]):not([type=range]):not([type=file]),textarea{width:100%}
input[type=range]{width:100%}
input[type=checkbox]{accent-color:var(--fill-success)}
label{display:block}
summary{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.c{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.h{font-weight:500;font-size:15px;margin:0 0 6px}
.s{font-size:12px;color:var(--text-secondary)}
.pl{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--surface-1);margin:2px 4px 2px 0}
.bar{height:8px;border-radius:4px;background:var(--surface-1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill-success)}
.rw{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pr{background:var(--fill-success);color:var(--on-success);border-color:transparent}
.pr:hover{background:var(--fill-success);filter:brightness(1.1)}
.nv{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surface-0);border-top:0.5px solid var(--border);padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;z-index:5}
.nv button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;min-height:48px}
.nv button.on{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.nv i{font-size:18px}
.bob{animation:bob 3s ease-in-out infinite}
.bl{transform-origin:80px 62px;animation:bl 4s infinite}
.wv{transform-origin:110px 108px;animation:wv 1s ease-in-out infinite}
.cheer{animation:ch .7s ease-in-out infinite}
.chw{transform-origin:80px 78px;animation:cw .4s infinite}
.zz{animation:zz 2s infinite}
.cf{animation:ch 1s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wv{50%{transform:rotate(-18deg)}}
@keyframes ch{50%{transform:translateY(-6px)}}
@keyframes cw{50%{transform:scaleY(.4)}}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rg{from{stroke-dasharray:0 200}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div class="c"><p class="h">Shopping list from your diet</p><button onclick="SLS=!SLS;R()" style="width:100%">${SLS?'Hide':'Generate for the next 7 days'}</button>${wl?Object.entries(wl.m).map(x=>`<div class="rw" style="justify-content:space-between;padding:3px 0"><span style="font-size:14px">${ING[x[0]][0]}</span><span class="s">${r(x[1])} ${ING[x[0]][1]}</span></div>`).join('')+`<div class="s" style="margin-top:6px">Estimated meal cost for the week: ₹${wl.cs}</div>`:''}</div>`}
function prog(){const L=ach(),days=[...Array(7)].map((_,i)=>dk(da(-i))),e7=days.reduce((a,k)=>a+Object.keys(D.E[k]||{}).length,0);
return`<div class="g2" style="margin-bottom:10px"><div class="c" style="margin:0"><div style="font-size:24px;font-weight:500">${r(e7/42*100)}%</div><div class="s">Weekly consistency</div></div><div class="c" style="margin:0"><div style="font-size:24px;font-weight:500">${streak()}</div><div class="s">Day streak</div></div></div><div class="s" style="margin-bottom:8px">Missed days are fine. Consistency over weeks is what counts.</div>
<div class="g2">${L.map(a=>`<div class="c" style="margin:0;${a.ok?'border-color:var(--border-success);background:var(--bg-success)':''}"><i class="ti ${a.ok?'ti-trophy':'ti-lock'}" style="font-size:20px" aria-hidden="true"></i><div style="font-size:14px;font-weight:500">${a.n}</div><div class="s">${a.ok?'Unlocked '+D.UL[a.id]:a.d}</div>${a.ok?'':`<div class="s">${a.pg}</div>`}</div>`).join('')}</div>`}
function ai(q){q=q.toLowerCase();const k=dk(),t=tot(k),rem=Math.max(0,r(D.P.pro-t.p));
if(/week|summary/.test(q)){const dd2=[...Array(7)].map((_,i)=>dk(da(-i))),ts=dd2.map(tot);return`Last 7 days: about ${r(ts.reduce((a,x)=>a+x.k,0)/7)} kcal and ${r(ts.reduce((a,x)=>a+x.p,0)/7)} g protein a day. Meals eaten: ${dd2.reduce((a,x)=>a+Object.keys(D.E[x]||{}).length,0)} of 42. Workouts: ${dd2.filter(x=>gymDays().includes(x)).length}.`}
if(/protein/.test(q))return`You've had ${r(t.p)} g protein today. Your target is ${D.P.pro} g, so ${rem} g to go. Easy adds: 2 boiled eggs (about 12 g, ₹14), 100 g firm tofu (about 13 g), 100 g cooked chicken (about 25 g).`;
if(/gas|bloat|gut|ibs|digest/.test(q)){const c=corr();return`Eat slowly, keep portions moderate, prefer cooked vegetables, use hing instead of lots of onion and garlic, and choose lactose-free milk if milk bothers you. Chickpeas and rajma are best tested in tiny portions. ${c.length?'Your diary so far links highest scores with: '+c.map(x=>x[0]).join(', ')+'. That is a pattern, not proof.':'Log symptoms with triggers to spot patterns.'} Ongoing pain, blood in stool or weight loss deserve a doctor visit.`}
if(/cheap|budget|afford|save/.test(q)){const sp=D.B.reduce((a,b)=>a+(b.g?+b.a||0:0),0);return`Budget left: ₹${r(D.P.budget-sp)}. Cheap protein: eggs (about ₹7 each), rohu instead of pricier fish, peanuts, dal and rice together, seasonal vegetables. Trim walnuts and out-of-season fruit first if you need to save.`}
if(/zinc|iron|b12|omega|vitamin|hair/.test(q))return Object.entries(HN).map(x=>x[0]+': '+x[1]).join('. ')+'. Food supports hair health but cannot reverse genetic thinning.';
if(/substitut|alternative|instead|without|chicken/.test(q))return'Swap 150 g chicken (about 37 g protein) for 3 eggs (about 19 g), 150 g fish (about 25 g) or 150 g firm tofu (about 20 g). Use the swap menu on the Diet page and your totals update automatically.';
return'I can explain your protein, weekly summary, gut patterns, cheap meals, hair nutrients and food swaps. Try one of the buttons.'}
function aip(){const k=dk(),t=tot(k);return`Today in FitVerse: ${r(t.k)} kcal, ${r(t.p)} g protein, water ${(D.W[k]||0)/1000} L. Goals: ${D.P.kcal} kcal, ${D.P.pro} g protein. Gut diary entries: ${D.GU.length}. Please give me friendly, non-medical advice for muscle gain, IBS-friendly eating and hair nutrition.`}
function aiP(){return`<div class="c"><p class="h">FitVerse AI</p><div class="s">This built-in helper works offline using your data. It gives general food guidance and never diagnoses.</div><div class="g2" style="margin-top:8px">${['Protein left today','Weekly summary','Gas and bloating tips','Cheap meal ideas','Hair nutrients','Chicken alternatives'].map(x=>`<button onclick="aq('${x}')">${x}</button>`).join('')}</div><div class="rw" style="margin-top:8px"><input id="aqi" placeholder="Ask about your food" style="flex:1"><button class="pr" onclick="aq($('aqi').value)">Ask</button></div></div>${AIA?`<div class="c" style="animation:pop .3s">${esc(AIA)}</div>`:''}<button style="width:100%" onclick="askC()">Copy today's summary and open Claude</button>`}
function set(){const sw=(key,arr)=>arr.map(c=>`<button aria-label="${c}" onclick="sp2('${key}','${c}')" style="width:36px;height:36px;border-radius:50%;background:${c};border:${D.P[key]==c?'3px solid var(--border-accent)':'0.5px solid var(--border)'};padding:0"></button>`).join('');
const f=(l,key,ty)=>`<label class="s">${l}<input type="${ty||'number'}" value="${esc(D.P[key])}" onchange="sp2('${key}',this.value)"></label>`;
return`<div class="c"><p class="h">Profile and targets</p><div class="g2">${f('Name','name','text')}${f('Calories','kcal')}${f('Protein g','pro')}${f('Carbs g','carb')}${f('Fats g','fat')}${f('Water litres','water')}</div></div>
<div class="c"><p class="h">Your companion</p><div class="s">Skin</div><div class="rw">${sw('skin',['#F1C9A5','#E8B98F','#C68B5E','#8D5A3B'])}</div><div class="s" style="margin-top:6px">Hoodie</div><div class="rw">${sw('hood',['#1D9E75','#378ADD','#7F77DD','#D85A30','#444441'])}</div><div class="s" style="margin-top:6px">Hair</div><div class="rw">${sw('hair',['#2C2C2A','#5F3B1E','#B8862B','#888780'])}</div></div>
<div class="c"><p class="h">Export and backup</p><div class="g2"><button onclick="ex(1)">Export my data</button><button onclick="ex(2)">Export 30-day plan</button></div><textarea id="xa" rows="5" style="margin-top:6px" placeholder="Exported text appears here. To restore a backup, paste it here and tap Import."></textarea><div class="g2" style="margin-top:6px"><button onclick="ex(3)">Copy</button><button onclick="im()">Import</button></div><div class="s" style="margin-top:6px">Your data is saved in this browser. Keep a backup copy somewhere safe.</div></div>
<div class="c"><button onclick="rs()" style="width:100%">${RS?'Tap again to erase everything':'Reset all data'}</button></div>`}
const NAV=[['home','ti-home','Home'],['diet','ti-salad','Diet'],['nut','ti-chart-bar','Nutrition'],['gut','ti-heartbeat','Gut'],['hair','ti-sparkles','Hair'],['gym','ti-barbell','Gym'],['bud','ti-shopping-cart','Budget'],['prog','ti-trophy','Progress'],['ai','ti-robot','AI'],['set','ti-settings','Settings']];
function R(){chk();const pg={home,diet,nut,gut,hair,gym,bud,prog,ai:aiP,set}[PG];
$('app').innerHTML=`<div class="rw" style="justify-content:space-between;margin-bottom:10px"><div><div style="font-size:20px;font-weight:500;letter-spacing:2px">FITVERSE</div><div class="s">Build Better Habits. Build a Better You.</div></div><button onclick="th()" aria-label="Switch light or dark mode"><i class="ti ti-moon"></i></button></div>${TO?`<div class="c" style="background:var(--bg-success);border-color:var(--border-success);animation:pop .4s"><i class="ti ti-trophy" aria-hidden="true"></i> ${esc(TO)}</div>`:''}${pg()}<div class="nv">${NAV.map(n=>`<button class="${PG==n[0]?'on':''}" onclick="go('${n[0]}')"><i class="ti ${n[1]}" aria-hidden="true"></i>${n[2]}</button>`).join('')}</div>`;tick();window.scrollTo(0,0)}
function tick(){const n=new Date;document.querySelectorAll('.clk').forEach(e=>e.textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));document.querySelectorAll('.cd').forEach(e=>e.textContent=cdT());const e=$('dt');if(e)e.textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function go(p){PG=p;ERR='';first=false;R()}
function wt(n){const k=dk();D.W[k]=Math.max(0,(D.W[k]||0)+n);save();R()}
function sv2(key,v){D[key][dk()]=+v;save();R()}
function hb2(i){const k=dk();D.H[k]=D.H[k]||{};D.H[k][i]=!D.H[k][i];save();R()}
function wd(){const k=dk();if(gymDays().includes(k)){D.WD[k]=0;D.GY=D.GY.filter(g=>g.d!=k)}else{D.WD[k]=60;tr={s:'gym',t:'Workout logged. Great job getting stronger today.'};setTimeout(()=>{tr=null;R()},5000)}save();R()}
function ds(n){const d=new Date(DS+'T00:00:00');d.setDate(d.getDate()+n);DS=dk(d);R()}
function eat(k,s,i){D.E[k]=D.E[k]||{};if(D.E[k][s]!==undefined)delete D.E[k][s];else{D.E[k][s]=i;tr={s:'eat',t:"Nice. Eat slowly, your digestion matters too."};setTimeout(()=>{tr=null;R()},5000)}save();R()}
function sub(s,v){const L=PL[s].length,d=new Date(DS+'T00:00:00'),base=(di(d)+s)%L;D.SUB[DS+'|'+s]=((+v-base)%L+L)%L;save();R()}
function ax(){const n=$('xn').value.trim(),k=+$('xk').value;if(!n||!k){ERR='Enter a food name and calories.';R();return}ERR='';const d=dk();D.X[d]=D.X[d]||[];D.X[d].push({n,k,p:+$('xp').value||0,c:+$('xc').value||0,f:+$('xf').value||0});save();R()}
function rx(i){D.X[dk()].splice(i,1);save();R()}
function sg(){const v=id=>$(id).value;D.GU.push({d:dk(),t:v('gt'),g:+v('gg'),b:+v('gb'),p:+v('gp'),s:+v('gs'),m:v('gm'),x:v('gx')});save();R()}
function ri(){const f=$('rf').value.trim();if(!f)return;D.RI.push({d:dk(),f,r:$('rr').value});save();R()}
function hcT(i){const k=dk();D.HC[k]=D.HC[k]||{};if(D.HC[k][i])delete D.HC[k][i];else D.HC[k][i]=1;save();R()}
function hn(){const t=$('ht').value.trim();if(!t)return;D.HN.push({d:dk(),c:$('hc').value,t});save();R()}
function ph(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,300/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.HP.push({d:dk(),img:c.toDataURL('image/jpeg',.7)});PB=D.HP.length-1;save();R()};im.src=rd.result};rd.readAsDataURL(f)}
function lg(){const ex=$('ge').value.trim(),s=+$('gsx').value,rp=+$('grx').value,kg=+$('gkx').value;if(!ex||!s||!rp){ERR='Enter the exercise, sets and reps.';R();return}ERR='';const pv=Math.max(0,...D.GY.filter(g=>g.ex.toLowerCase()==ex.toLowerCase()).map(g=>g.kg));D.GY.push({d:dk(),ex,s,r:rp,kg});if(pv>0&&kg>pv){tr={s:'celebrate',t:'New personal record on '+ex+'!'};setTimeout(()=>{tr=null;R()},5000)}save();R()}
function lw(){const kg=+$('wk').value;if(!kg)return;D.WT.push({d:dk(),kg,w:+$('ww').value||0,c:+$('wc').value||0,a:+$('wa').value||0});save();R()}
function bg(i){D.B[i].g=!D.B[i].g;save();R()}
function bu(i,f,v){D.B[i][f]=+v;save();R()}
function sp2(k,v){D.P[k]=['name','skin','hood','hair'].includes(k)?v:+v;save();R()}
function aq(q){AIA=ai(q);R()}
function ex(m){const a=$('xa');if(m==1)a.value=JSON.stringify(D);if(m==2){let t='FITVERSE 30-day plan\n';for(let d=0;d<30;d++){t+='\nDay '+(d+1)+'\n';for(let s=0;s<6;s++){const x=PL[s][(d+s)%PL[s].length];t+=PT[s]+' '+PN[s]+': '+x.n+' ('+x.q+') '+x.k+' kcal, '+x.p+' g protein, Rs '+x.cs+'\n'}}a.value=t}if(m==3){a.select();try{navigator.clipboard.writeText(a.value)}catch(e){}}}
function im(){try{D=Object.assign(D,JSON.parse($('xa').value));D.P=Object.assign({},P0,D.P);save();R()}catch(e){$('xa').value='That text could not be read. Paste the full exported data.'}}
function rs(){if(!RS){RS=true;R();return}try{localStorage.removeItem('fitverse1')}catch(e){}D={P:Object.assign({},P0),E:{},X:{},W:{},SL:{},ST:{},H:{},SUB:{},GY:[],WD:{},WT:[],GU:[],RI:[],HC:{},HN:[],HP:[],B:G0.map(g=>({n:g[0],q:g[1],e:g[2],a:0,g:false})),UL:{}};RS=false;save();R()}
R();setInterval(tick,1000);setTimeout(()=>{first=false;if(PG=='home')R()},4000);
</script>
