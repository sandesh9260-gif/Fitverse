.br{transform-origin:100px 160px;animation:br 3s ease-in-out infinite}
.bl{transform-origin:100px 70px;animation:bl 4s infinite}

.cheer{animation:ch .6s ease-in-out infinite}
.chw{transform-origin:100px 88px;animation:cw .4s infinite}
.zz{animation:zz 2s infinite}
.cf{animation:ch 1s infinite}
.glow{animation:glow 1.6s ease-in-out infinite}
.spk{animation:spk 1.4s ease-in-out infinite}
.run{transform-origin:100px 180px;animation:run .4s ease-in-out infinite}

@keyframes br{50%{transform:scaleY(1.025)}}

<div class="c"><p class="h">Your companion</p><div class="rw"><div style="flex:none">${av('celebrate')}</div><div><div class="s">Skin</div><div class="rw">${sw('skin',['#F1C9A5','#E8B98F','#C68B5E','#8D5A3B'])}</div><div class="s" style="margin-top:6px">Hoodie</div><div class="rw" style="flex-wrap:wrap">${sw('hood',['#10B981','#38BDF8','#A78BFA','#F97316','#F472B6','#334155'])}</div><div class="s" style="margin-top:6px">Hair</div><div class="rw">${sw('hair',['#1F2937','#5F3B1E','#B8862B','#9CA3AF','#10B981'])}</div></div></div></div>
<div class="c"><p class="h">Export and backup</p><div class="g2"><button onclick="ex(1)">Export my data</button><button onclick="ex(2)">Export 30-day plan</button></div><textarea id="xa" rows="5" style="margin-top:6px" placeholder="Exported text appears here. To restore a backup, paste it here and tap Import."></textarea><div class="g2" style="margin-top:6px"><button onclick="ex(3)">Copy</button><button onclick="im()">Import</button></div><div class="s" style="margin-top:6px">Your data is saved in this browser. Keep a backup copy somewhere safe.</div></div>
<div class="c"><button onclick="rs()" style="width:100%">${RS?'Tap again to erase everything':'Reset all data'}</button></div>`}
const NAV=[['home','ti-home','Home'],['diet','ti-salad','Diet'],['nut','ti-chart-bar','Nutrition'],['gut','ti-heartbeat','Gut'],['hair','ti-sparkles','Hair'],['gym','ti-barbell','Gym'],['bud','ti-shopping-cart','Budget'],['prog','ti-trophy','Progress'],['ai','ti-robot','AI'],['set','ti-settings','Settings']];
function R(){chk();const pg={home,diet,nut,gut,hair,gym,bud,prog,ai:aiP,set}[PG],a=$('app');
a.className=ANIM?'in':'';ANIM=false;
a.innerHTML=`<div class="rw" style="justify-content:space-between;margin-bottom:10px"><div><div style="font-size:20px;font-weight:600;letter-spacing:2px;color:var(--text-success)">FITVERSE</div><div class="s">Build Better Habits. Build a Better You.</div></div><button onclick="th()" aria-label="Switch light or dark mode"><i class="ti ti-moon"></i></button></div>${TO?`<div class="c toast" style="background:var(--bg-success);border-color:var(--border-success);font-weight:500"><i class="ti ti-trophy" aria-hidden="true"></i> ${esc(TO)}</div>`:''}${pg()}<div class="nv">${NAV.map(n=>`<button class="${PG==n[0]?'on':''}" onclick="go('${n[0]}')"><i class="ti ${n[1]}" aria-hidden="true"></i>${n[2]}</button>`).join('')}</div>`;tick()}
function tick(){const n=new Date;document.querySelectorAll('.clk').forEach(e=>e.textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));document.querySelectorAll('.cd').forEach(e=>e.textContent=cdT());const e=$('dt');if(e)e.textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function go(p){PG=p;ERR='';first=false;ANIM=true;R();window.scrollTo(0,0)}
function mv(n){PM+=n;if(PM>11){PM=0;PY++}if(PM<0){PM=11;PY--}R()}
function after(k){const s=score(k);if(s==100)toast('Perfect day! Score 100.','achieve',3);else fx(2)}
function wt(n){const k=dk(),b=D.W[k]||0;D.W[k]=Math.max(0,b+n);save();if(n>0&&b<D.P.water*1000&&D.W[k]>=D.P.water*1000)toast('Water goal reached!','celebrate',2);else if(n>0)fx(1);R()}
function sv2(key,v){D[key][dk()]=+v;save();fx(2);R()}
function hb2(i){const k=dk();D.H[k]=D.H[k]||{};D.H[k][i]=!D.H[k][i];save();if(D.H[k][i])after(k);R()}
function wd(){const k=dk();if(gymDays().includes(k)){D.WD[k]=0;D.GY=D.GY.filter(g=>g.d!=k);save()}else{D.WD[k]=60;save();if(score(k)==100)toast('Perfect day! Workout done and everything complete.','achieve',3);else toast('Workout logged. Great job getting stronger today.','gym',3)}R()}
function ds(n){const d=new Date(DS+'T00:00:00');d.setDate(d.getDate()+n);DS=dk(d);R()}
function eat(k,s,i){D.E[k]=D.E[k]||{};if(D.E[k][s]!==undefined){delete D.E[k][s];save()}else{D.E[k][s]=i;save();const t=tot(k);if(k==dk()&&score(k)==100)toast('Perfect day! Score 100.','achieve',3);else if(t.p>=D.P.pro&&t.p-PL[s][i].p<D.P.pro)toast('Protein target hit! Your muscles say thanks.','celebrate',3);else if(Object.keys(D.E[k]).length==6)toast('All 6 meals eaten today.','celebrate',3);else toast('Nice. Eat slowly, your digestion matters too.','eat',2)}R()}
function sub(s,v){const L=PL[s].length,d=new Date(DS+'T00:00:00'),base=(di(d)+s)%L;D.SUB[DS+'|'+s]=((+v-base)%L+L)%L;save();R()}
function ax(){const n=$('xn').value.trim(),k=+$('xk').value;if(!n||!k){ERR='Enter a food name and calories.';R();return}ERR='';const d=dk();D.X[d]=D.X[d]||[];D.X[d].push({n,k,p:+$('xp').value||0,c:+$('xc').value||0,f:+$('xf').value||0});save();fx(2);R()}
function rx(i){D.X[dk()].splice(i,1);save();R()}
function sg(){const v=id=>$(id).value;D.GU.push({d:dk(),t:v('gt'),g:+v('gg'),b:+v('gb'),p:+v('gp'),s:+v('gs'),m:v('gm'),x:v('gx')});save();fx(2);R()}
function ri(){const f=$('rf').value.trim();if(!f)return;D.RI.push({d:dk(),f,r:$('rr').value});save();fx(2);R()}
function hcT(i){const k=dk();D.HC[k]=D.HC[k]||{};if(D.HC[k][i])delete D.HC[k][i];else{D.HC[k][i]=1;if(Object.keys(D.HC[k]).length==8)toast('Hair checklist complete!','celebrate',3);else fx(2)}save();R()}
function hn(){const t=$('ht').value.trim();if(!t)return;D.HN.push({d:dk(),c:$('hc').value,t});save();fx(2);R()}
function ph(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,300/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.HP.push({d:dk(),img:c.toDataURL('image/jpeg',.7)});PB=D.HP.length-1;save();fx(2);R()};im.src=rd.result};rd.readAsDataURL(f)}
function lg(){const ex=$('ge').value.trim(),s=+$('gsx').value,rp=+$('grx').value,kg=+$('gkx').value;if(!ex||!s||!rp){ERR='Enter the exercise, sets and reps.';R();return}ERR='';const pv=Math.max(0,...D.GY.filter(g=>g.ex.toLowerCase()==ex.toLowerCase()).map(g=>g.kg));D.GY.push({d:dk(),ex,s,r:rp,kg});save();if(pv>0&&kg>pv)toast('New personal record on '+ex+'!','celebrate',3);else fx(2);R()}
function lw(){const kg=+$('wk').value;if(!kg)return;D.WT.push({d:dk(),kg,w:+$('ww').value||0,c:+$('wc').value||0,a:+$('wa').value||0});save();fx(2);R()}
function bg(i){D.B[i].g=!D.B[i].g;save();if(D.B[i].g)fx(2);R()}
function bu(i,f,v){D.B[i][f]=+v;save();R()}
function sp2(k,v){D.P[k]=['name','skin','hood','hair'].includes(k)?v:+v;save();R()}
function aq(q){AIA=ai(q);R()}
function ex(m){const a=$('xa');if(m==1)a.value=JSON.stringify(D);if(m==2){let t='FITVERSE 30-day plan\n';for(let d=0;d<30;d++){t+='\nDay '+(d+1)+'\n';for(let s=0;s<6;s++){const x=PL[s][(d+s)%PL[s].length];t+=PT[s]+' '+PN[s]+': '+x.n+' ('+x.q+') '+x.k+' kcal, '+x.p+' g protein, Rs '+x.cs+'\n'}}a.value=t}if(m==3){a.select();try{navigator.clipboard.writeText(a.value)}catch(e){}}}
function im(){try{D=Object.assign(D,JSON.parse($('xa').value));D.P=Object.assign({},P0,D.P);save();R()}catch(e){$('xa').value='That text could not be read. Paste the full exported data.'}}
function rs(){if(!RS){RS=true;R();return}try{localStorage.removeItem('fitverse1')}catch(e){}D={P:Object.assign({},P0),E:{},X:{},W:{},SL:{},ST:{},H:{},SUB:{},GY:[],WD:{},WT:[],GU:[],RI:[],HC:{},HN:[],HP:[],B:G0.map(g=>({n:g[0],q:g[1],e:g[2],a:0,g:false})),UL:{}};RS=false;save();R()}
R();setInterval(tick,1000);setTimeout(()=>{first=false;if(PG=='home')R()},4000);
